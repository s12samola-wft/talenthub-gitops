apiVersion: batch/v1
kind: CronJob

metadata:
  name: talenthub-backup-report

spec:
  schedule: "0 2 * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup-report
              image: busybox:1.36
              command:
                - sh
                - -c
                - echo "Generating TalentHub backup report..."

          restartPolicy: Never

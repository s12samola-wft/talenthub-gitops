apiVersion: batch/v1
kind: Job

metadata:
  name: talenthub-db-init

spec:
  template:
    spec:
      containers:
        - name: db-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo "Initializing TalentHub database..." && sleep 5 && echo "Database initialization complete."

      restartPolicy: Never

  backoffLimit: 3
